[workspace]
members = ["crates/*", "providers/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions only: each crate names the features it uses.
[workspace.dependencies]
agent = { path = "crates/agent" }
disk = { path = "crates/disk" }
fetch = { path = "crates/fetch" }
hotkeys = { path = "crates/hotkeys" }
journal = { path = "crates/journal" }
model = { path = "crates/model" }
pe = { path = "crates/pe" }
wand = { path = "providers/wand" }

aes = "0.8"
anyhow = "1"
blocking = "1"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4", default-features = false }
embed-resource = "3"
form_urlencoded = "1"
futures = "0.3"
gpui-kit = "=0.9.1"
h2 = "0.4"
http = "1"
log = "0.4"
rusty-leveldb = "4.0.2"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tao = "0.37.2"
tokio = "1"
ureq = "3.5.2"
url = "2"
uuid = "1"
webview2-com = "0.39"
windows-registry = "0.6"
windows-sys = "0.61"
wry = "0.57.2"
