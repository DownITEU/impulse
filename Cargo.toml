[package]
name = "impulse"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1"
blocking = "1"
cbc = { version = "0.1", features = ["alloc"] }
form_urlencoded = "1"
futures = "0.3"
gpui-kit = "=0.9.1"
rusty-leveldb = "4.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
ureq = "3.5.2"
url = "2"
webview2-com = "0.39"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
wry = "0.57.2"
