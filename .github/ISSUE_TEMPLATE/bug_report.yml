name: Bug report
description: Something in Impulse does not work
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [latest release](https://github.com/tweak-for-me/impulse/releases/latest) first: the bug may be fixed already.

        **Attach the log.** Open **LOG** in the status bar and click **COPY ALL** right after the problem (**FOLDER** opens `impulse.log` and `impulse.old.log`). Remove personal paths first, and never post tokens or account data.

  - type: input
    id: version
    attributes:
      label: Impulse version
      description: Shown in the status bar and on the About tab.
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Trainer source and its version
      description: For example the installed Wand version, or the plugin's name.

  - type: input
    id: game
    attributes:
      label: Game and launcher
      placeholder: Neon Harbor, Steam

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Library and game list
        - Trainer and cheats
        - Hotkeys
        - Overlay
        - Map and minimap
        - Phone (remote panel)
        - Plugins
        - Updates
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?

  - type: textarea
    id: log
    attributes:
      label: Log
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Screenshots and other context
