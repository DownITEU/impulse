<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56" role="img" aria-label="Star Impulse on GitHub to follow updates">
    <title>Star Impulse on GitHub to follow updates</title>
    <defs>
        <clipPath id="frame"><rect width="880" height="56" rx="6"/></clipPath>
        <linearGradient id="sheen" x1="0" x2="1">
            <stop offset="0" stop-color="#c6ff3d" stop-opacity="0"/>
            <stop offset=".5" stop-color="#c6ff3d" stop-opacity=".16"/>
            <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="halo">
            <stop offset="0" stop-color="#c6ff3d" stop-opacity=".45"/>
            <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
        </radialGradient>
        <style>
            .star, .halo, .sheen { transform-box: fill-box; transform-origin: center; }
            .star { animation: pop 2.6s ease-in-out infinite; }
            .halo { animation: glow 2.6s ease-in-out infinite; }
            .sheen { animation: sweep 5.2s ease-in-out infinite; }
            .chip { animation: chip 2.6s ease-in-out infinite; }
            @keyframes pop { 0%, 100% { transform: scale(1) rotate(0); } 45% { transform: scale(1.28) rotate(20deg); } }
            @keyframes glow { 0%, 100% { opacity: .35; transform: scale(.8); } 45% { opacity: 1; transform: scale(1.25); } }
            @keyframes sweep { 0% { transform: translateX(0); } 60%, 100% { transform: translateX(1100px); } }
            @keyframes chip { 0%, 100% { fill-opacity: .1; } 45% { fill-opacity: .24; } }
            @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
        </style>
    </defs>
    <rect width="880" height="56" rx="6" fill="#0a0b0a"/>
    <rect x=".5" y=".5" width="879" height="55" rx="5.5" fill="none" stroke="#c6ff3d" stroke-opacity=".28"/>
    <g clip-path="url(#frame)">
        <rect class="sheen" x="-180" y="-10" width="140" height="76" fill="url(#sheen)" transform="skewX(-20)"/>
    </g>
    <g transform="translate(34 28)">
        <circle class="halo" r="22" fill="url(#halo)"/>
        <polygon class="star" fill="#c6ff3d" points="0,-11 2.7,-3.72 10.46,-3.4 4.37,1.42 6.47,8.9 0,4.6 -6.47,8.9 -4.37,1.42 -10.46,-3.4 -2.7,-3.72"/>
    </g>
    <text x="68" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" letter-spacing="1.2" fill="#c6ff3d">STAR THE REPO</text>
    <text x="200" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#c9cfc3">to follow new releases and what ships next</text>
    <rect class="chip" x="768" y="13" width="92" height="30" rx="4" fill="#c6ff3d" stroke="#c6ff3d" stroke-opacity=".7"/>
    <text x="814" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#c6ff3d">STAR</text>
</svg>
