name: Release

# A tag v1.2.3 publishes a release, v1.2.3-pre a pre-release: Impulse's updater tells them by that suffix.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag and take its notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Output release-notes.md

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/panel/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/panel/pnpm-lock.yaml

      - name: Build the remote panel
        shell: pwsh
        run: ./scripts/panel.ps1

      - name: Test
        run: cargo test --quiet -p checks -p updater

      - name: Build
        run: cargo build --release

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $flags = @('--latest')
          if ($tag.Contains('-')) { $flags = @('--prerelease', '--latest=false') }
          # gh uploads assets to a draft before publishing the immutable release.
          gh release create $tag target/release/Impulse.exe --verify-tag --title $tag --notes-file release-notes.md @flags

  # A release made with GITHUB_TOKEN triggers no other workflow, so the Discord post lives here.
  discord:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post the patch notes to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json name,url,body,isPrerelease > release.json
          # Headings become bold (embeds render them unreliably); an embed description caps at 4096.
          jq '. as $r | {
            embeds: [{
              title: $r.name,
              url: $r.url,
              description: ($r.body | gsub("\r"; "") | gsub("(?m)^#{1,6} +(?<h>.+)$"; "**\(.h)**")
                | if length > 3800 then .[:3800] + "\n\n[Read the rest on GitHub](\($r.url))" else . end),
              color: (if $r.isPrerelease then 16756768 else 13041469 end)
            }],
            allowed_mentions: {parse: []}
          }' release.json > payload.json
          curl -sSf -X POST -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK"
