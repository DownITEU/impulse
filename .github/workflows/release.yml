name: Release

# A tag v1.2.3 publishes a release, v1.2.3-pre a pre-release: Impulse's updater tells them by that suffix.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag and take its notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Output release-notes.md

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/panel/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/panel/pnpm-lock.yaml

      - name: Build the remote panel
        shell: pwsh
        run: ./scripts/panel.ps1

      - name: Test
        run: cargo test --quiet -p checks -p updater

      - name: Build
        run: cargo build --release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: target/release/Impulse.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
