name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/panel/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/panel/pnpm-lock.yaml

      - name: Build the remote panel
        shell: pwsh
        run: ./scripts/panel.ps1

      - name: Test
        run: cargo test --quiet -p checks -p updater
